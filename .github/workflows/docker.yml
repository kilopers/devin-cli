name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Сервер на обычном x86 — arm64 через QEMU не нужна
          platforms: linux/amd64
          push: true
          # Кэш слоёв в GitHub Actions — тяжёлые (apt/Node/PHP/Devin)
          # не пересобираются при изменении только кода
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      
      
      - name: Deploy hook → watchtower
        if: success()
        env:
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
        run: |
          [ -n "$DEPLOY_HOOK_URL" ] || exit 0
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            -A "Mozilla/5.0" \
            "$DEPLOY_HOOK_URL"
