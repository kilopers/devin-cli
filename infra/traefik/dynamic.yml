http:
  routers:
    devin:
      rule: "Host(`ai.kilop.ru`)"
      entryPoints: [websecure]
      service: devin
      tls:
        certResolver: le
    devin-dev:
      rule: "Host(`dev.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: devin-dev
      tls:
        certResolver: le
    mihomo:
      rule: "Host(`mihomo.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: mihomo
      tls:
        certResolver: le
    turcia:
      rule: "Host(`turcia.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: turcia
      tls:
        certResolver: le
    santeh:
      rule: "Host(`santeh.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: santeh
      tls:
        certResolver: le
    techcontrol:
      rule: "Host(`techcontrol.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: techcontrol
      tls:
        certResolver: le
    myai-ws:
      rule: "Host(`myai.ai.kilop.ru`) && PathPrefix(`/app`)"
      entryPoints: [websecure]
      service: myai-ws
      tls:
        certResolver: le
    myai:
      rule: "Host(`myai.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: myai
      tls:
        certResolver: le
    techcontrol-watchtower:
      rule: "Host(`techcontrol.ai.kilop.ru`) && PathPrefix(`/_watchtower`)"
      entryPoints: [websecure]
      service: techcontrol-watchtower
      middlewares: [wt-strip]
      tls:
        certResolver: le
    myai-watchtower:
      rule: "Host(`myai.ai.kilop.ru`) && PathPrefix(`/_watchtower`)"
      entryPoints: [websecure]
      service: myai-watchtower
      middlewares: [wt-strip]
      tls:
        certResolver: le
    mygarage-watchtower:
      rule: "Host(`mygarage.ai.kilop.ru`) && PathPrefix(`/_watchtower`)"
      entryPoints: [websecure]
      service: mygarage-watchtower
      middlewares: [wt-strip]
      tls:
        certResolver: le
    mediccrm:
      rule: "Host(`mediccrm.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: mediccrm
      tls:
        certResolver: le
    mediccrm-watchtower:
      rule: "Host(`mediccrm.ai.kilop.ru`) && PathPrefix(`/_watchtower`)"
      entryPoints: [websecure]
      service: mediccrm-watchtower
      middlewares: [wt-strip]
      tls:
        certResolver: le
    pomogator:
      rule: "Host(`pomogator.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: pomogator
      tls:
        certResolver: le
    pomogator-admin:
      rule: "Host(`pomogator-admin.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: pomogator-admin
      tls:
        certResolver: le
    pomogator-api:
      rule: "Host(`pomogator-api.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: pomogator-api
      tls:
        certResolver: le
    afinadashboard:
      rule: "Host(`afinadashboard.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: afinadashboard
      tls:
        certResolver: le
    afinadashboard-watchtower:
      rule: "Host(`afinadashboard.ai.kilop.ru`) && PathPrefix(`/_watchtower`)"
      entryPoints: [websecure]
      service: afinadashboard-watchtower
      middlewares: [wt-strip]
      tls:
        certResolver: le
    monitor:
      rule: "Host(`monitor.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: monitor
      tls:
        certResolver: le
    monitor-watchtower:
      rule: "Host(`monitor.ai.kilop.ru`) && PathPrefix(`/_watchtower`)"
      entryPoints: [websecure]
      service: monitor-watchtower
      middlewares: [wt-strip]
      tls:
        certResolver: le
  middlewares:
    wt-strip:
      stripPrefix:
        prefixes: ["/_watchtower"]
  services:
    devin:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8089"
    devin-dev:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8390"
