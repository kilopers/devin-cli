# Маршруты: домен -> сервис. Новый домен = новый блок в routers+services,
# сертификат LE выпустится автоматически (должен резолвиться на этот IP).
http:
  routers:
    devin:
      rule: "Host(`ai.kilop.ru`)"
      entryPoints: [websecure]
      service: devin
      tls:
        certResolver: le
    soslan:
      rule: "Host(`soslan.ai.kilop.ru`)"
      entryPoints: [websecure]
      service: soslan
      tls:
        certResolver: le
  services:
    devin:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8089"
    soslan:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8091"
