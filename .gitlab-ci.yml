# Сборка и публикация Docker-образа воркера (BuildKit).
# Образ: docker.kilop.ru/ai/devin — реджистри задан переменными
# DOCKER_REGISTRY_URL/LOGIN/TOKEN в настройках CI/CD гитлаба
# (по аналогии с проектами techcontrol/mygarage).
#
# Кэш двойной:
#   - type=registry,ref=...:buildcache (mode=max) — кэширует все стадии;
#   - inline-кэш (BUILDKIT_INLINE_CACHE=1) — :latest сам служит
#     источником кэша, если :buildcache ещё нет.
#
# Теги образа:
#   - latest          — дефолтная/прод-ветка (watchtower тянет её;
#                       также дёргается deploy-хук /deploy)
#   - <имя ветки>     — любая ветка
#   - <sha коммита>   — точная привязка к ревизии
#   - <тег vX.Y.Z>    — семантические теги релизов

stages:
  - build
  - deploy
  - notify

variables:
  # Без аттестаций (provenance/sbom) — self-hosted реджистри их не принимает.
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  # Предзалитый бандл Devin CLI из package registry ЭТОГО проекта —
  # CDN static.devin.ai у раннера качает ~400KB/s и рвётся по таймауту.
  # При обновлении версии CLI: залить новый tar.gz (bin/+share/) сюда же
  # и поднять DEVIN_BUNDLE_VER.
  DEVIN_BUNDLE_VER: "3000.11.205"

build-image:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login $DOCKER_REGISTRY_URL -u $DOCKER_REGISTRY_LOGIN -p $DOCKER_REGISTRY_TOKEN
    # предзалитый бандл → Dockerfile кладёт его в _versions/<ver>,
    # install.sh пропускает скачивание
    - mkdir -p devin-bundle/$DEVIN_BUNDLE_VER
    - |
      curl -fsSL --retry 3 -o /tmp/devin-bundle.tar.gz \
        -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/devin-cli-bundle/$DEVIN_BUNDLE_VER/devin.tar.gz" \
        && tar xzf /tmp/devin-bundle.tar.gz -C devin-bundle/$DEVIN_BUNDLE_VER \
        && echo "bundle: $(ls devin-bundle/$DEVIN_BUNDLE_VER/bin/devin)"
    # Отдельный builder на драйвере docker-container — нужен для
    # экспорта кэша type=registry (дефолтный docker-драйвер не умеет).
    - docker buildx create --use --driver docker-container
  script:
    - |
      TAGS="-t $DOCKER_REGISTRY_URL/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS -t $DOCKER_REGISTRY_URL/$CI_PROJECT_PATH:latest"
        echo "Дефолтная/прод-ветка '$CI_COMMIT_BRANCH': добавляю тег latest"
      fi
      if [ -n "$CI_COMMIT_REF_SLUG" ]; then
        TAGS="$TAGS -t $DOCKER_REGISTRY_URL/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS -t $DOCKER_REGISTRY_URL/$CI_PROJECT_PATH:$CI_COMMIT_TAG"
      fi
      echo "Build tags: $TAGS"
    - docker buildx build --pull --push
        --build-arg BUILDKIT_INLINE_CACHE=1
        --cache-to   "type=registry,ref=$DOCKER_REGISTRY_URL/$CI_PROJECT_PATH:buildcache,mode=max"
        --cache-from "type=registry,ref=$DOCKER_REGISTRY_URL/$CI_PROJECT_PATH:buildcache"
        --cache-from "$DOCKER_REGISTRY_URL/$CI_PROJECT_PATH:latest"
        $TAGS .
  tags:
    - docker

# После пуша образа дёргаем deploy-хук самого воркера:
# POST https://ai.kilop.ru/deploy с Bearer → воркер пробрасывает в
# watchtower /v1/update, тот пересоздаёт контейнер на свежем latest.
# WATCHTOWER_HOOK_TOKEN = WATCHTOWER_HTTP_API_TOKEN из .env на сервере.
deploy-watchtower:
  stage: deploy
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      curl -fsS -X POST \
        "https://ai.kilop.ru/deploy" \
        -H "Authorization: Bearer $WATCHTOWER_HOOK_TOKEN"
  tags:
    - docker

# Автоконтроль деплоя: статус пайплайна уходит в веб-панель
# (секция «Деплой»), приёмник открытый — токен не нужен.
deploy-status:
  stage: notify
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      curl -fsS -X POST "https://ai.kilop.ru/api/deploy/status" \
        -H "Content-Type: application/json" \
        -d "{\"project\":\"devin-cli\",\"status\":\"success\",\"data\":\"pipeline $CI_PIPELINE_ID / $CI_COMMIT_SHORT_SHA\"}"
  tags:
    - docker

deploy-status-failed:
  stage: notify
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure
  script:
    - |
      curl -fsS -X POST "https://ai.kilop.ru/api/deploy/status" \
        -H "Content-Type: application/json" \
        -d "{\"project\":\"devin-cli\",\"status\":\"failed\",\"data\":\"pipeline $CI_PIPELINE_ID / $CI_COMMIT_SHORT_SHA\"}"
  tags:
    - docker
