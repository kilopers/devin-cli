<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devin Worker — вход</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; padding: 16px; background: #f5f6fa;
         font-family: Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         color: rgba(0,0,0,.87); }
  .card { width: 380px; max-width: 100%; background: #fff; border-radius: 4px;
          box-shadow: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14),
                      0 1px 3px 0 rgba(0,0,0,.12);
          padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 400; }
  h1 span { color: #3f51b5; }
  .alert { padding: 6px 16px; border-radius: 4px; background: #fdeded;
           color: #5f2120; font-size: .875rem; line-height: 1.43; }
  .field { position: relative; }
  .field input { width: 100%; height: 56px; padding: 16px 14px 0; font: inherit;
                 font-size: 16px; border: 1px solid rgba(0,0,0,.23);
                 border-radius: 4px; outline: none; background: transparent; }
  .field input:hover { border-color: rgba(0,0,0,.87); }
  .field input:focus { border: 2px solid #3f51b5; padding-left: 13px; }
  .field label { position: absolute; left: 14px; top: 6px; font-size: 12px;
                 color: rgba(0,0,0,.6); pointer-events: none; }
  .field input:focus + label { color: #3f51b5; }
  button { height: 42px; border: 0; border-radius: 4px; background: #3f51b5;
           color: #fff; font: inherit; font-size: .9375rem; font-weight: 500;
           letter-spacing: .03em; text-transform: uppercase; cursor: pointer;
           box-shadow: 0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px 0 rgba(0,0,0,.14),
                       0 1px 5px 0 rgba(0,0,0,.12); }
  button:hover { background: #303f9f; }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <h1><span>Devin</span> Worker</h1>
  {% if error %}<div class="alert">Неверный логин или пароль</div>{% endif %}
  <div class="field">
    <input id="user" name="user" autocomplete="username" autocapitalize="none"
           required autofocus>
    <label for="user">Логин</label>
  </div>
  <div class="field">
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <label for="password">Пароль</label>
  </div>
  <button type="submit">Войти</button>
</form>
</body>
</html>
