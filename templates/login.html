<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devin Worker — вход</title>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
  rel="stylesheet">
<script crossorigin
  src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin
  src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin
  src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script crossorigin
  src="https://cdn.jsdelivr.net/npm/@emotion/react@11.13.3/dist/emotion-react.umd.min.js"></script>
<script crossorigin
  src="https://cdn.jsdelivr.net/npm/@emotion/styled@11.13.0/dist/emotion-styled.umd.min.js"></script>
<script crossorigin
  src="https://cdn.jsdelivr.net/npm/@mui/material@6.4.8/umd/material-ui.production.min.js"></script>
<script crossorigin
  src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<noscript>Для входа нужен включённый JavaScript</noscript>
<script>window.LOGIN_ERROR = {{ error | tojson }};</script>
<script type="text/babel" data-presets="react">
{% raw %}
const {ThemeProvider, createTheme, CssBaseline, Box, Card, CardContent,
       CardActions, Typography, TextField, Button, Alert, Icon,
       InputAdornment} = MaterialUI;

const theme = createTheme({palette: {primary: {main: "#3f51b5"}}});

const icon = name =>
  <InputAdornment position="start"><Icon>{name}</Icon></InputAdornment>;

function LoginCard() {
  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />
      <Box sx={{minHeight: "100vh", display: "flex", alignItems: "center",
                justifyContent: "center", bgcolor: "#f5f6fa", p: 2}}>
        <Card component="form" method="post" action="/login"
              sx={{width: 380, maxWidth: "100%"}}>
          <CardContent
              sx={{display: "flex", flexDirection: "column", gap: 2, p: 3}}>
            <Typography variant="h5" component="h1">
              <Box component="span" sx={{color: "primary.main"}}>Devin</Box>
              {" Worker"}
            </Typography>
            {window.LOGIN_ERROR &&
              <Alert severity="error">Неверный логин или пароль</Alert>}
            <TextField name="user" label="Логин" autoComplete="username"
                       autoFocus required fullWidth
                       slotProps={{input: {startAdornment: icon("person")}}} />
            <TextField name="password" label="Пароль" type="password"
                       autoComplete="current-password" required fullWidth
                       slotProps={{input: {startAdornment: icon("lock")}}} />
          </CardContent>
          <CardActions sx={{p: 3, pt: 0}}>
            <Button type="submit" variant="contained" size="large" fullWidth>
              Войти
            </Button>
          </CardActions>
        </Card>
      </Box>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LoginCard />);
{% endraw %}
</script>
</body>
</html>
