<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devin Worker</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/static/icon.png">
<link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; background: #f5f7fb; }
  #feed { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 16px 12px 150px; }
  #topbar { position: sticky; top: 0; z-index: 20; }
  #tabs { display: flex; flex-wrap: wrap; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #tabs a { padding: 12px 20px; font-size: 14px; font-weight: 500; color: #5f6368;
            text-transform: none; border-bottom: 2px solid transparent; cursor: pointer; }
  #tabs a.active { color: #3f51b5; border-bottom-color: #3f51b5; }
  .task-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .task-head .meta { font-size: 12px; color: #9aa0a6; }
  .prompt { white-space: pre-wrap; font-weight: 500; margin: 8px 0; }
  pre.out { background: #101418; color: #d3e3fd; border-radius: 6px; padding: 12px;
            font-size: 12.5px; line-height: 1.45; white-space: pre-wrap;
            word-break: break-word; max-height: 480px; overflow-y: auto; margin: 0; }
  .chip { font-size: 12px; height: 24px; line-height: 24px; }
  .chip.queued { background: #eceff1; color: #546e7a; }
  .chip.running { background: #e3f2fd; color: #1565c0; }
  .chip.done { background: #e8f5e9; color: #2e7d32; }
  .chip.failed { background: #ffebee; color: #c62828; }
  #composer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
              box-shadow: 0 -2px 8px rgba(0,0,0,.14); padding: 12px 16px; z-index: 10; }
  #composer .inner { max-width: 960px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; }
  #composer textarea { flex: 1; max-height: 160px; min-height: 48px; resize: none;
                       font-family: inherit; font-size: 14px; padding: 10px;
                       border: 1px solid #dadce0; border-radius: 8px; outline: none; }
  #composer textarea:focus { border-color: #3f51b5; }
  #empty { color: #9aa0a6; text-align: center; margin-top: 60px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #90caf9;
          border-top-color: transparent; border-radius: 50%; vertical-align: -2px;
          margin-right: 6px; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .src { font-size: 11px; color: #78909c; border: 1px solid #cfd8dc;
         border-radius: 10px; padding: 1px 8px; }
  .md { font-size: 14px; line-height: 1.6; word-break: break-word;
        max-height: 600px; overflow-y: auto; }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: .8em 0 .35em; font-weight: 600; line-height: 1.3; }
  .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.1em; } .md h4 { font-size: 1em; }
  .md p { margin: .45em 0; }
  .md pre { background: #101418; border-radius: 6px; padding: 12px;
            overflow-x: auto; font-size: 12.5px; line-height: 1.45; margin: .6em 0; }
  .md pre code { background: none; padding: 0; color: inherit;
                 font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }
  .md :not(pre) > code { background: #eceff1; color: #ad1457; padding: 1px 5px; border-radius: 4px; }
  .md blockquote { border-left: 3px solid #c5cae9; margin: .5em 0; padding: 2px 12px; color: #5f6368; }
  .md ul, .md ol { padding-left: 24px; margin: .4em 0; }
  .md a { color: #3f51b5; }
  .md table { border-collapse: collapse; margin: .6em 0; }
  .md th, .md td { border: 1px solid #dadce0; padding: 4px 10px; font-size: 13px; }
  .md th { background: #f1f3f4; }
  .md .hljs-addition { background: rgba(46,160,67,.18); }
  .md .hljs-deletion { background: rgba(248,81,73,.18); }
  #modelSel, #modeSel { height: 30px; margin: 17px 10px 0 0; max-width: 320px;
              background: rgba(255,255,255,.15); color: #fff; border: none;
              border-radius: 4px; font-size: 13px; padding: 0 6px; }
  #modelSel option, #modeSel option { color: #212121; }
  #modeSel { max-width: 140px; }
  #micBtn { border-radius: 50%; height: 42px; padding: 0; width: 42px; }
  #micBtn.rec { color: #e53935; animation: pulse 1s infinite; }
  #micBtn i.spinning { animation: rot .8s linear infinite; }
  #micStat { font-size: 12px; min-width: 44px; margin-right: 6px;
             white-space: nowrap; }
  @keyframes pulse { 50% { opacity: .35; } }
  .brand-icon { height: 24px; width: 24px; vertical-align: middle;
                margin: -3px 8px 0 0; filter: invert(1); }
  .sidenav-brand { display: flex; align-items: center; gap: 10px;
                   padding: 14px 16px; font-size: 16px; font-weight: 600; }
  .sidenav-brand img { height: 22px; }
  /* mobile: project tabs live in the left drawer (sidenav) instead of the
     row under the navbar; model/mode selects + status move there too */
  #hdrCtrls { display: contents; }
  #mobileNav li.proj a.active { color: #3f51b5; font-weight: 600; }
  #hdrCtrlsSlot { padding: 12px 16px; }
  #hdrCtrlsSlot > * { float: none; }
  #hdrCtrlsSlot #wstatus { display: block; color: #5f6368; font-size: 13px;
      margin-bottom: 10px; }
  #hdrCtrlsSlot #modelSel, #hdrCtrlsSlot #modeSel {
      display: block; width: 100%; max-width: none; height: 38px;
      margin: 0 0 10px; color: #212121; background: #fff;
      border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; }
  @media (max-width: 992px) {
    #tabs { display: none; }
  }
  @media (max-width: 600px) {
    #feed { padding: 12px 8px 170px; }
    .task-head { flex-wrap: wrap; }
    #composer { padding: 10px 12px; }
    #composer .inner { flex-wrap: wrap; }
    #composer textarea { flex: 1 1 100%; }
    #micStat { min-width: 0; }
    #sendBtn { flex: 1; }
  }
</style>
</head>
<body>
<header id="topbar">
  <nav class="indigo">
    <div class="nav-wrapper" style="padding:0 16px">
      <a href="#" data-target="mobileNav" class="sidenav-trigger"
         title="проекты и настройки"><i class="material-icons">menu</i></a>
      <span class="brand-logo" style="font-size:20px"><img src="/static/favicon.svg"
        class="brand-icon" alt="">Devin Worker</span>
      <a id="logoutBtn" href="#" class="right" title="выйти"
         style="padding:0 8px"><i class="material-icons">logout</i></a>
      <a id="profileBtn" href="#" class="right" title="профиль"
         style="padding:0 8px"><i class="material-icons">person</i></a>
      <span id="hdrCtrls"><select id="modeSel" class="browser-default right"
              title="режим: код — меняет репо, вопрос — только отвечает">
        <option value="code">🛠 код</option>
        <option value="ask">💬 вопрос</option>
      </select>
      <select id="modelSel" class="browser-default right"
              title="модель Devin"></select>
      <span class="right" id="wstatus" style="font-size:13px;opacity:.9">…</span></span>
    </div>
  </nav>
  <div id="tabs"></div>
</header>
<ul id="mobileNav" class="sidenav">
  <li><span class="sidenav-brand"><img src="/static/favicon.svg"
      alt="">Devin Worker</span></li>
  <li><a class="subheader">Проекты</a></li>
  <li id="navDivider"><div class="divider"></div></li>
  <li id="hdrCtrlsSlot"></li>
</ul>
<div id="feed"><div id="empty">Загрузка…</div></div>
<div id="profileModal" class="modal" style="max-width:400px">
  <div class="modal-content">
    <h6 style="margin-top:0">Смена пароля</h6>
    <div class="input-field">
      <input id="pwCur" type="password" autocomplete="current-password">
      <label for="pwCur">Текущий пароль</label>
    </div>
    <div class="input-field">
      <input id="pwNew" type="password" autocomplete="new-password">
      <label for="pwNew">Новый пароль (мин. 6 символов)</label>
    </div>
    <div class="input-field">
      <input id="pwNew2" type="password" autocomplete="new-password">
      <label for="pwNew2">Новый пароль ещё раз</label>
    </div>
  </div>
  <div class="modal-footer">
    <a id="pwSave" class="btn indigo waves-effect waves-light">Сохранить</a>
  </div>
</div>
<div id="composer">
  <div class="inner">
    <textarea id="taskText" placeholder="Задача для Devin по проекту «…» — Ctrl+Enter чтобы отправить"></textarea>
    <button id="micBtn" class="btn-flat" title="надиктовать голосом">
      <i class="material-icons">mic</i>
    </button>
    <span id="micStat" class="grey-text"></span>
    <button id="sendBtn" class="btn indigo waves-effect waves-light">
      <i class="material-icons left">send</i>В работу
    </button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
let currentProject = null, lastTabs = "", multiMode = false;
let feedItems = new Map(), oldestStem = null;
let hasMore = false, loadingOlder = false, lastSig = "";

const esc = s => s.replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// every API call goes through this — a 401 (expired session) → /login
const api = (u, o) => window["fetch"](u, o).then(r => {
  if (r.status === 401) { location = "/login"; throw new Error("401"); }
  return r;
});

// project switch: from desktop tabs or the mobile drawer — the tab also
// switches the worker's active project (like /project in telegram), so new
// web tasks and devin sessions follow it; drawer closes after the pick
function selectProject(p) {
  currentProject = p;
  if (multiMode)
    api("/api/project", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({project: currentProject})})
      .then(r => r.json()).then(d => {
        if (!d.ok) M.toast({html: "Проект: " + (d.error || "?")});
      }).catch(() => {});
  document.querySelectorAll("#tabs a, #mobileNav li.proj a").forEach(x =>
    x.classList.toggle("active", x.dataset.p === p));
  feedItems.clear(); oldestStem = null;
  hasMore = false; lastSig = "";
  loadTasks();
  const sn = M.Sidenav.getInstance(document.getElementById("mobileNav"));
  if (sn) sn.close();
}

async function loadProjects() {
  const d = await (await api("/api/projects")).json();
  multiMode = d.projects.length > 0;
  const projs = d.projects.length ? d.projects : ["workspace"];
  const key = projs.join("|");
  if (key !== lastTabs) {
    lastTabs = key;
    const cur = currentProject || d.current;
    document.getElementById("tabs").innerHTML = projs.map(p =>
      `<a data-p="${esc(p)}" class="${p === cur ? "active" : ""}">${esc(p)}</a>`
    ).join("");
    // the same list is mirrored into the mobile drawer
    const navUl = document.getElementById("mobileNav");
    navUl.querySelectorAll("li.proj").forEach(li => li.remove());
    const divider = document.getElementById("navDivider");
    projs.forEach(p => {
      const li = document.createElement("li");
      li.className = "proj";
      li.innerHTML =
        `<a data-p="${esc(p)}" class="${p === cur ? "active" : ""}">${esc(p)}</a>`;
      navUl.insertBefore(li, divider);
    });
    document.querySelectorAll("#tabs a, #mobileNav li.proj a").forEach(a =>
      a.onclick = () => selectProject(a.dataset.p));
  }
  if (!currentProject) currentProject = d.current || projs[0];
  document.getElementById("taskText").placeholder =
    `Задача для Devin по проекту «${currentProject}» — Ctrl+Enter чтобы отправить`;
}

const STATUS_RU = {queued: "в очереди", running: "выполняется", done: "готово"};
const SRC_RU = {telegram: "telegram", web: "web", file: "файл"};

function chip(t) {
  if (t.status === "done" && t.task_status && !/exit code: 0/.test(t.task_status))
    return `<span class="chip failed">ошибка</span>`;
  const cls = t.status === "running" ? "running" : t.status === "done" ? "done" : "queued";
  const spin = t.status === "running" ? '<span class="spin"></span>' : "";
  return `<span class="chip ${cls}">${spin}${STATUS_RU[t.status] || t.status}</span>`;
}

// devin's answer is markdown — render it to sanitized HTML with syntax
// highlighting; live (running) output stays a raw console tail
function renderMd(text) {
  const div = document.createElement("div");
  div.innerHTML = DOMPurify.sanitize(
    marked.parse(text, {breaks: true, gfm: true}));
  div.querySelectorAll("pre code").forEach(c => {
    try { hljs.highlightElement(c); } catch (e) {}
  });
  return div.innerHTML;
}

const feedNow = () =>
  [...feedItems.values()].sort((a, b) => a.created - b.created);

function mergeTasks(list) {
  list.forEach(t => feedItems.set(t.stem, t));
  const items = feedNow();
  oldestStem = items.length ? items[0].stem : null;
  return items;
}

function renderFeed(items) {
  const sig = items.map(t => t.stem + t.status + (t.task_status || "") +
    (t.commit_offered ? "C" : "") +
    (t.output || "").length).join() + "|" + loadingOlder;
  if (sig === lastSig) return;
  lastSig = sig;
  const feed = document.getElementById("feed");
  const nearBottom = innerHeight + scrollY >= document.body.offsetHeight - 120;
  feed.innerHTML =
    (loadingOlder ? '<div class="center grey-text" style="padding:6px">' +
      '<span class="spin"></span>загружаю ранние…</div>' : "") +
    (items.length ? items.map(t => `
    <div class="card"><div class="card-content" style="padding:14px 18px">
      <div class="task-head">
        <span class="meta">${esc(t.name)} · ${new Date(t.created*1000).toLocaleString("ru-RU")}
          <span class="src">${esc(SRC_RU[t.source] || t.source || "")}</span>
          ${t.model ? `<span class="src">${esc(t.model)}</span>` : ""}
          ${t.mode === "ask" ? '<span class="src">💬 вопрос</span>' : ""}</span>
        ${chip(t)}
      </div>
      <div class="prompt">${esc(t.prompt)}</div>
      ${t.output ? (t.status === "done"
        ? `<div class="md">${renderMd(t.output)}</div>`
        : `<pre class="out">${esc(t.output)}</pre>`) : ""}
      ${t.commit_offered ? `
      <div style="margin-top:10px">
        <button class="btn-small green waves-effect waves-light"
          onclick="commitAct('${esc(t.stem)}','commit')">✅ закоммитить и запушить</button>
        <button class="btn-flat"
          onclick="commitAct('${esc(t.stem)}','skip')">⏭ пропустить</button>
      </div>` : ""}
    </div></div>`).join("")
    : '<div id="empty">Задач пока нет — напиши первую внизу.</div>');
  if (nearBottom) scrollTo(0, document.body.scrollHeight);
  const lastOut = feed.querySelector(".card:last-child pre.out");
  if (lastOut && nearBottom) lastOut.scrollTop = lastOut.scrollHeight;
}

// commit/push offer on a finished task — same actions as tg buttons
async function commitAct(stem, action) {
  try {
    const r = await api("/api/commit", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({stem, action})});
    const d = await r.json();
    if (d.ok && d.skipped) {
      M.toast({html: "Пропущено — изменения остались в репо"});
    } else if (d.ok) {
      const tail = (d.result || "").trim();
      M.toast({html: "Закоммичено и запушено" + (tail
        ? `<pre style="white-space:pre-wrap;text-align:left;max-width:90vw">` +
          esc(tail.slice(-900)) + `</pre>` : ""), displayLength: 8000});
    } else {
      M.toast({html: "Коммит: " + (d.error || r.status)});
    }
  } catch (e) { M.toast({html: "Коммит сеть: " + e}); }
  loadTasks();
}

// poll: newest page only — merges updates/new arrivals into the feed
async function loadTasks() {
  if (!currentProject) return;
  const d = await (await api("/api/tasks?project=" +
    encodeURIComponent(currentProject) + "&limit=5")).json();
  if (!feedItems.size) hasMore = d.has_more;
  renderFeed(mergeTasks(d.tasks));
}

// scroll to top loads the 5 tasks right before the oldest one shown
async function loadOlder() {
  if (!hasMore || loadingOlder || !oldestStem) return;
  loadingOlder = true;
  renderFeed(feedNow());
  try {
    const d = await (await api("/api/tasks?project=" +
      encodeURIComponent(currentProject) + "&limit=5&before=" +
      encodeURIComponent(oldestStem))).json();
    const prevH = document.body.scrollHeight, prevY = scrollY;
    hasMore = d.tasks.some(t => !feedItems.has(t.stem)) ? d.has_more : false;
    const items = mergeTasks(d.tasks);
    loadingOlder = false;
    renderFeed(items);
    scrollTo(0, prevY + document.body.scrollHeight - prevH);
  } catch (e) {
    loadingOlder = false;
    renderFeed(feedNow());
  }
}

addEventListener("scroll", () => { if (scrollY < 200) loadOlder(); });

async function loadStatus() {
  const d = await (await api("/api/status")).json();
  document.getElementById("wstatus").textContent =
    (d.current_task ? `▶ ${d.current_task}` : "idle") +
    ` · очередь ${d.queue} · ${d.model}`;
  const ms = document.getElementById("modeSel");
  if (d.mode && document.activeElement !== ms) ms.value = d.mode;
}

// режим ответа — свой у веба (kv.reply_mode_web), у телеграма свой
document.getElementById("modeSel").onchange = async e => {
  const r = await api("/api/mode", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({mode: e.target.value})});
  const d = await r.json();
  M.toast({html: d.ok
    ? (e.target.value === "ask" ? "Режим: ответ на вопрос" : "Режим: код")
    : "Ошибка: " + (d.error || r.status)});
};

// model picker: catalog comes from `devin models list` (cached in
// tasks/devin-models.json); the choice persists in tasks/model.txt
let lastModelsSig = "";
async function loadModels() {
  try {
    const d = await (await api("/api/models")).json();
    const sel = document.getElementById("modelSel");
    const sig = JSON.stringify(d.models) + "=>" + d.current;
    if (sig !== lastModelsSig && document.activeElement !== sel) {
      lastModelsSig = sig;
      const list = d.models.length ? d.models
        : [{id: d.current, description: ""}];
      sel.innerHTML = list.map(m =>
        `<option value="${esc(m.id)}"${m.id === d.current ? " selected" : ""}>` +
        esc(m.id + (m.description ? " — " + m.description.slice(0, 90) : "")) +
        `</option>`).join("");
      sel.title = `модель Devin — сейчас ${d.current}`;
    }
  } catch (e) {}
}

document.getElementById("modelSel").onchange = async e => {
  const r = await api("/api/model", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({model: e.target.value})});
  const d = await r.json();
  M.toast({html: d.ok ? `Модель: ${e.target.value}` :
                       "Ошибка: " + (d.error || r.status)});
  lastModelsSig = ""; loadModels(); loadStatus();
};

async function send() {
  const ta = document.getElementById("taskText");
  const text = ta.value.trim();
  if (!text) return;
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  try {
    const r = await api("/api/tasks", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({project: currentProject === "workspace" ? null : currentProject,
                            text})});
    const d = await r.json();
    if (d.ok) { ta.value = ""; lastSig = ""; loadTasks(); }
    else M.toast({html: "Ошибка: " + (d.error || r.status)});
  } catch (e) { M.toast({html: "Сеть: " + e}); }
  btn.disabled = false;
}

// voice dictation: AudioContext → PCM16 WAV @16kHz → /api/stt → textarea.
// Yandex accepts only 8000/16000/48000 — ask ctx for 16k, else resample.
const STT_RATE = 16000;
let rec = null;
const micBtn = document.getElementById("micBtn");

function resample(chunks, srcRate, dstRate) {
  const srcLen = chunks.reduce((a, c) => a + c.length, 0);
  const src = new Float32Array(srcLen);
  let off = 0;
  for (const c of chunks) { src.set(c, off); off += c.length; }
  if (srcRate === dstRate || !srcLen) return [src];
  const dstLen = Math.round(srcLen * dstRate / srcRate);
  const dst = new Float32Array(dstLen);
  const ratio = srcRate / dstRate;
  for (let i = 0; i < dstLen; i++) {
    const p = i * ratio, i0 = Math.floor(p),
          i1 = Math.min(i0 + 1, srcLen - 1), f = p - i0;
    dst[i] = src[i0] + (src[i1] - src[i0]) * f;
  }
  return [dst];
}

function encodeWav(chunks, rate) {
  const len = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++)
    v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); ws(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, "data"); v.setUint32(40, len * 2, true);
  let o = 44;
  for (const ch of chunks)
    for (let i = 0; i < ch.length; i++, o += 2) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
  return buf;
}

const micStat = document.getElementById("micStat");
const fmtDur = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" +
                    String(Math.floor(s % 60)).padStart(2, "0");
let sttPoll = null;

micBtn.onclick = async () => {
  const ic = micBtn.querySelector("i");
  if (rec) {  // стоп → распознавание
    const r = rec; rec = null;
    clearTimeout(r.timer); clearInterval(r.clock);
    r.proc.disconnect(); r.src.disconnect(); r.gain.disconnect();
    r.stream.getTracks().forEach(t => t.stop());
    const wav = encodeWav(resample(r.chunks, r.ctx.sampleRate, STT_RATE),
                          STT_RATE);
    r.ctx.close();
    micBtn.classList.remove("rec");
    ic.textContent = "hourglass_empty"; ic.classList.add("spinning");
    micStat.textContent = "распознаю…";
    // длинные записи идут через async-путь — показываем прогресс сервера
    sttPoll = setInterval(async () => {
      try {
        const s = await (await api("/api/status")).json();
        if (s.stt_status) micStat.textContent = s.stt_status;
      } catch (e) {}
    }, 3000);
    try {
      const resp = await api("/api/stt", {method: "POST",
        headers: {"Content-Type": "application/octet-stream"}, body: wav});
      const d = await resp.json();
      if (d.ok && d.text.trim()) {
        const ta = document.getElementById("taskText");
        ta.value = (ta.value ? ta.value.replace(/\s+$/, "") + " " : "") +
                   d.text.trim();
        ta.focus();
      } else if (!d.ok) {
        M.toast({html: "STT: " + (d.error || resp.status)});
      } else {
        M.toast({html: "Ничего не распознано"});
      }
    } catch (e) { M.toast({html: "STT сеть: " + e}); }
    clearInterval(sttPoll); sttPoll = null;
    micStat.textContent = "";
    ic.classList.remove("spinning"); ic.textContent = "mic";
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const ctx = new (window.AudioContext || window.webkitAudioContext)(
      {sampleRate: STT_RATE});   // Safari может проигнорировать — ниже ресемпл
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const gain = ctx.createGain();       // в ноль — чтобы не было эха
    gain.gain.value = 0;
    const chunks = [];
    proc.onaudioprocess = e =>
      chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(proc); proc.connect(gain); gain.connect(ctx.destination);
    const t0 = Date.now();
    rec = {ctx, proc, src, gain, stream, chunks,
           clock: setInterval(
             () => micStat.textContent = fmtDur((Date.now() - t0) / 1000),
             250),
           timer: setTimeout(() => { if (rec) micBtn.click(); }, 300000)};
    micStat.textContent = "00:00";
    micBtn.classList.add("rec");
  } catch (e) { M.toast({html: "Микрофон: " + e}); }
};

// mobile drawer (hamburger → projects + settings) and adaptive header:
// on narrow screens the model/mode selects and status text physically move
// from the navbar into the drawer — same DOM nodes, handlers stay wired
M.Sidenav.init(document.getElementById("mobileNav"), {edge: "left"});
const mqMobile = matchMedia("(max-width: 992px)");
const hdrCtrls = {
  home: document.getElementById("hdrCtrls"),
  slot: document.getElementById("hdrCtrlsSlot"),
  wstatus: document.getElementById("wstatus"),
  model: document.getElementById("modelSel"),
  mode: document.getElementById("modeSel"),
};
function placeHdrCtrls() {
  if (mqMobile.matches)
    hdrCtrls.slot.append(hdrCtrls.wstatus, hdrCtrls.model, hdrCtrls.mode);
  else
    hdrCtrls.home.append(hdrCtrls.mode, hdrCtrls.model, hdrCtrls.wstatus);
}
if (mqMobile.addEventListener)
  mqMobile.addEventListener("change", placeHdrCtrls);
else mqMobile.addListener(placeHdrCtrls);
placeHdrCtrls();

// profile modal (password change) + logout
M.Modal.init(document.getElementById("profileModal"));
document.getElementById("profileBtn").onclick = e => {
  e.preventDefault();
  M.Modal.getInstance(document.getElementById("profileModal")).open();
};
document.getElementById("logoutBtn").onclick = e => {
  e.preventDefault();
  api("/logout", {method: "POST"}).finally(() => location = "/login");
};
document.getElementById("pwSave").onclick = async () => {
  const cur = document.getElementById("pwCur"),
        n1 = document.getElementById("pwNew"),
        n2 = document.getElementById("pwNew2");
  if (n1.value !== n2.value)
    return M.toast({html: "Новые пароли не совпадают"});
  try {
    const d = await (await api("/api/password", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({current: cur.value, new: n1.value})})).json();
    M.toast({html: d.ok ? "Пароль изменён" : "Ошибка: " + (d.error || "?")});
    if (d.ok) {
      M.Modal.getInstance(document.getElementById("profileModal")).close();
      cur.value = n1.value = n2.value = "";
    }
  } catch (e) { M.toast({html: "Сеть: " + e}); }
};

document.getElementById("sendBtn").onclick = send;
document.getElementById("taskText").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
loadProjects().then(loadTasks);
loadStatus();
loadModels();
setInterval(() => { loadStatus(); loadTasks(); loadModels(); }, 3000);
</script>
