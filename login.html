<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devin Worker — вход</title>
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  body { display: flex; min-height: 100vh; align-items: center;
         justify-content: center; background: #f5f6fa; }
  .card { width: 360px; max-width: calc(100vw - 32px); }
  .card .card-title { font-size: 22px; }
  .brand { color: #3f51b5; }
</style>
</head>
<body>
<div class="card">
  <form method="post" action="/login">
    <div class="card-content">
      <span class="card-title"><span class="brand">Devin</span> Worker</span>
      <div class="input-field">
        <i class="material-icons prefix">person</i>
        <input id="user" name="user" type="text" autocomplete="username"
               autofocus required>
        <label for="user">Логин</label>
      </div>
      <div class="input-field">
        <i class="material-icons prefix">lock</i>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
        <label for="password">Пароль</label>
      </div>
      <div id="err" class="red-text" style="display:none">
        Неверный логин или пароль
      </div>
    </div>
    <div class="card-action">
      <button class="btn indigo waves-effect waves-light" type="submit"
              style="width:100%">Войти</button>
    </div>
  </form>
</div>
<script>
if (new URLSearchParams(location.search).has("err"))
  document.getElementById("err").style.display = "block";
</script>
</body>
</html>
