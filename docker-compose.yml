services:
  # Long-running watcher: polls tasks/inbox/ and runs each task through Devin.
  devin:
    image: ghcr.io/kilopers/devin-cli:latest
    restart: unless-stopped
    entrypoint: ["python3", "/app/watcher.py"]
    ports:
      # status page: http://server/ -> "I'm working" + queue/last task info
      - "${WEB_PORT:-80}:8080"
    environment:
      DEVIN_MODEL: ${DEVIN_MODEL:-swe}
      DEVIN_WORKDIR: /workspace
      DEVIN_PERMISSION_MODE: ${DEVIN_PERMISSION_MODE:-bypass}
      TASKS_DIR: /tasks
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-7200}
      # If set and PROJECT_DIR is empty — the repo is cloned automatically.
      GIT_REPO_URL: ${GIT_REPO_URL:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-devin-bot}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-devin-bot@localhost}
      # Optional: telegram bot running in parallel with the watcher.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TG_USERNAME: ${TG_USERNAME:-kiloper}
      MESSAGE_TEXT: ${MESSAGE_TEXT:-привет}
      INTERVAL: ${INTERVAL:-60}
      # Optional outbound proxy — devin API and telegram only; git always
      # goes direct. Empty = direct connections.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      - ${PROJECT_DIR:?Set PROJECT_DIR in .env}:/workspace
      - ./tasks:/tasks
      # Persistent Devin credentials + sessions — log in once, survives restarts.
      - ./devin-data:/root/.local/share/devin
      # Git over SSH (optional — comment out if you push over HTTPS).
      - ${HOME}/.ssh:/root/.ssh:ro

  # One-time interactive login:  docker compose --profile auth run --rm auth
  auth:
    image: ghcr.io/kilopers/devin-cli:latest
    profiles: ["auth"]
    stdin_open: true
    tty: true
    entrypoint: ["devin", "auth", "login", "--force-manual-token-flow"]
    volumes:
      - ./devin-data:/root/.local/share/devin
