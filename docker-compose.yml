services:
  # Long-running watcher: polls tasks/inbox/ and runs each task through Devin.
  devin:
    image: ghcr.io/kilopers/devin-cli:latest
    restart: unless-stopped
    entrypoint: ["python3", "/app/watcher.py"]
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      # watchtower watches only containers with this label
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      # status page: http://server/ -> "I'm working" + queue/last task info
      - "${WEB_PORT:-80}:8080"
    environment:
      DEVIN_MODEL: ${DEVIN_MODEL:-swe}
      DEVIN_WORKDIR: /workspace
      # Multi-project mode activates when /projects has subfolders.
      DEVIN_PROJECTS_DIR: /projects
      DEVIN_PERMISSION_MODE: ${DEVIN_PERMISSION_MODE:-bypass}
      TASKS_DIR: /tasks
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-7200}
      # If set and PROJECT_DIR is empty — the repo is cloned automatically.
      GIT_REPO_URL: ${GIT_REPO_URL:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-devin-bot}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-devin-bot@localhost}
      # false = agent leaves changes uncommitted; telegram buttons decide.
      GIT_AUTO_COMMIT: ${GIT_AUTO_COMMIT:-true}
      # true = resume the project's last session per task (default via env;
      # telegram /session overrides at runtime)
      DEVIN_CONTINUE: ${DEVIN_CONTINUE:-false}
      # Optional: telegram bot running in parallel with the watcher.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TG_USERNAME: ${TG_USERNAME:-kiloper}
      MESSAGE_TEXT: ${MESSAGE_TEXT:-привет}
      INTERVAL: ${INTERVAL:-60}  # 0 = send MESSAGE_TEXT once at startup
      # Webhook mode: voice/text -> task in inbox, result -> back to the chat
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Alternative STT provider (OpenAI-compatible API: OpenAI, Groq, …)
      STT_PROVIDER: ${STT_PROVIDER:-gemini}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_BASE_URL: ${STT_BASE_URL:-https://api.openai.com/v1}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_LANG: ${YANDEX_LANG:-ru-RU}
      # CI build status in the «Изменения» panel (GitHub Actions / GitLab).
      # Tokens only needed for private repos: GHA — actions:read,
      # GitLab — read_api. GITLAB_BASE_URL for self-hosted instances.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      # Веб-авторизация: один админ; хеш пароля сидится в kv из
      # WEB_ADMIN_PASSWORD при первом запуске, дальше меняется в профиле.
      # Пустой пароль + пустой kv = вход без авторизации (только для dev).
      WEB_ADMIN_USER: ${WEB_ADMIN_USER:-admin}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      # Всё состояние воркера — в MySQL (сервис mysql ниже): очередь и история
      # задач, вывод devin, проект/модель/режимы, pending-подтверждения.
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-devin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?задай в .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devin_worker}
      # Optional outbound proxy — devin API and telegram only; git always
      # goes direct. Empty = direct connections.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      - ${PROJECT_DIR:-./workspace}:/workspace
      - ${PROJECTS_DIR:-./projects}:/projects
      - ./tasks:/tasks
      # Persistent Devin credentials + sessions — log in once, survives restarts.
      - ./devin-data:/root/.local/share/devin
      # Встроенный прокси: watcher поднимает mihomo, если тут есть config.yaml
      # (шаблон — mihomo.example.yaml). Ключи подписки — каталог в .gitignore.
      - ./mihomo:/mihomo
      # Git over SSH (optional — comment out if you push over HTTPS).
      - ${HOME}/.ssh:/root/.ssh:ro

  # MySQL: очередь/история задач и всё состояние воркера (таблицы создаются
  # сами при старте; файлы tasks/*.txt|*.json импортируются один раз).
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devin_worker}
      MYSQL_USER: ${MYSQL_USER:-devin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?задай в .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "root", "-p$${MYSQL_RANDOM_ROOT_PASSWORD:-x}"]
      # random root password: ping needs no auth for the check below
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 20

  # Auto-deploy: polls GHCR every 5 min; when :latest changes, pulls it and
  # recreates the devin container (SIGTERM — a task in flight is killed).
  # Needs a GHCR login on the host once:
  #   echo $GITHUB_PAT | docker login ghcr.io -u kilopers --password-stdin
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
    command: ["--interval", "300", "--cleanup"]

  # One-time interactive login:  docker compose --profile auth run --rm auth
  auth:
    image: ghcr.io/kilopers/devin-cli:latest
    profiles: ["auth"]
    stdin_open: true
    tty: true
    entrypoint: ["devin", "auth", "login", "--force-manual-token-flow"]
    volumes:
      - ./devin-data:/root/.local/share/devin
