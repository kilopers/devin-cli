# soslan.ai.kilop.ru — статичная страница про Осетию.
# На хосте: /docker/soslan. nginx раздаёт site/ на :8091,
# Traefik (infra/traefik/dynamic.yml) маршрутит Host(`soslan.ai.kilop.ru`)
# на http://host.docker.internal:8091 с авто-HTTPS через Let's Encrypt.
services:
  soslan:
    image: nginx:alpine
    container_name: soslan
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
